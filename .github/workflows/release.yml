name: Đóng gói và phát hành

# Phát hành: tab Actions → "Đóng gói và phát hành" → Run workflow.
# Số phiên bản lấy từ $Script:AppVersion trong app/DonDep.ps1 (thẻ v<số> được tạo tự động).
# Đẩy thẻ v* bằng git cũng chạy được.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: 'Đăng lên trang Releases (bỏ chọn nếu chỉ muốn thử đóng gói)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra cú pháp PowerShell
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\app\DonDep.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; exit 1 }
          Write-Host 'Không có lỗi cú pháp.'

      - name: Đọc số phiên bản
        id: ver
        shell: powershell
        run: |
          $line = Select-String -Path app\DonDep.ps1 -Pattern "AppVersion\s*=\s*'([^']+)'" | Select-Object -First 1
          $ver = $line.Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.TrimStart('v') -ne $ver) {
            Write-Host "Phiên bản trong DonDep.ps1 ($ver) khác thẻ (${{ github.ref_name }})."; exit 1
          }
          "tag=v$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $ver"

      - name: Tạo file .exe
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force -Path out\DonDepMayTinh | Out-Null
          & $csc /nologo /target:winexe /optimize /win32icon:app\DonDep.ico /out:"out\DonDepMayTinh\Don Dep May Tinh.exe" /r:System.dll /r:System.Windows.Forms.dll app\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Đóng gói .zip
        shell: powershell
        run: |
          Copy-Item app\DonDep.ps1, app\DonDep.ico, 'app\HUONG DAN.txt', 'app\Mo app Don Dep.bat' out\DonDepMayTinh\
          Compress-Archive -Path out\DonDepMayTinh -DestinationPath out\DonDepMayTinh.zip -Force
          Get-ChildItem out\DonDepMayTinh

      - name: Lưu bản đóng gói (để tải thử)
        uses: actions/upload-artifact@v4
        with:
          name: DonDepMayTinh
          path: out/DonDepMayTinh.zip

      - name: Tạo trang phát hành
        if: github.ref_type == 'tag' || inputs.phat_hanh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Bản $TAG đã có — chỉ cập nhật file .zip."
            gh release upload "$TAG" out/DonDepMayTinh.zip --clobber
          else
            gh release create "$TAG" out/DonDepMayTinh.zip --target "$GITHUB_SHA" \
              --title "Dọn Dẹp Máy Tính $TAG" --notes-file .github/release-notes.md
          fi
