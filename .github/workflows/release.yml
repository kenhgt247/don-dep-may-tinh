name: Đóng gói và phát hành

# Phát hành: tab Actions → "Đóng gói và phát hành" → Run workflow.
# Số phiên bản lấy từ App.Version trong src/Core.cs (thẻ v<số> được tạo tự động).
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - '.github/release-v1.2.1.trigger'
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: 'Đăng lên trang Releases (bỏ chọn nếu chỉ muốn thử đóng gói)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Đọc số phiên bản
        id: ver
        shell: powershell
        run: |
          $m = Select-String -Path src\Core.cs -Pattern 'const string Version = "([^"]+)"' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.TrimStart('v') -ne $ver) {
            Write-Host "Version in Core.cs ($ver) differs from tag (${{ github.ref_name }})"; exit 1
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=v$ver`n", (New-Object Text.UTF8Encoding($false)))
          Write-Host "Version: $ver"

      - name: Biên dịch
        shell: pwsh
        run: dotnet build src/DonDepMayTinh.csproj -c Release -o build -nologo -clp:NoSummary

      - name: Chạy thử
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out\DonDepMayTinh | Out-Null
          Copy-Item build\DonDepMayTinh.exe 'out\DonDepMayTinh\Don Dep May Tinh.exe'
          if (Test-Path build\DonDepMayTinh.exe.config) { Copy-Item build\DonDepMayTinh.exe.config 'out\DonDepMayTinh\Don Dep May Tinh.exe.config' }
          Copy-Item 'dist\HUONG DAN.txt' out\DonDepMayTinh\
          Copy-Item 'dist\HUONG DAN.txt' out\DonDepMayTinh\dup_a.txt; Copy-Item 'dist\HUONG DAN.txt' out\DonDepMayTinh\dup_b.txt
          foreach ($mode in @('--selftest', '--selftest-en')) {
            $p = Start-Process -FilePath 'out\DonDepMayTinh\Don Dep May Tinh.exe' -ArgumentList $mode -Wait -PassThru
            $r = Get-Content out\DonDepMayTinh\selftest.txt -Raw -ErrorAction SilentlyContinue
            Write-Host "$mode exit=$($p.ExitCode) result=$r"
            if ($p.ExitCode -ne 0 -or $r -notmatch 'UI_OK' -or $r -notmatch 'TRAY_OK' -or $r -notmatch 'dup=[1-9]') {
              $msg = ("$mode exit=$($p.ExitCode) | $r") -replace "`r?`n", ' / '
              Write-Host "::error title=Selftest::$msg"
              exit 1
            }
          }
          Remove-Item out\DonDepMayTinh\selftest.txt, out\DonDepMayTinh\dup_a.txt, out\DonDepMayTinh\dup_b.txt -ErrorAction SilentlyContinue

      - name: Đóng gói .zip
        shell: powershell
        run: |
          Compress-Archive -Path out\DonDepMayTinh -DestinationPath out\DonDepMayTinh.zip -Force
          Get-ChildItem out\DonDepMayTinh

      - name: Lưu bản đóng gói (để tải thử)
        uses: actions/upload-artifact@v4
        with:
          name: DonDepMayTinh
          path: out/DonDepMayTinh.zip

      - name: Tạo trang phát hành
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref_name == 'main') || inputs.phat_hanh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating zip only."
            gh release upload "$TAG" out/DonDepMayTinh.zip --clobber
          else
            gh release create "$TAG" out/DonDepMayTinh.zip --target "$GITHUB_SHA" \
              --title "Dọn Dẹp Máy Tính $TAG" --notes-file .github/release-notes.md
          fi
