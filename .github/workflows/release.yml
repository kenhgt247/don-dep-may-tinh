name: Đóng gói và phát hành

# Phát hành: tab Actions → "Đóng gói và phát hành" → Run workflow.
# Số phiên bản lấy từ $Script:AppVersion trong app/DonDep.ps1 (thẻ v<số> được tạo tự động).
# Đẩy thẻ v* bằng git cũng chạy được.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: 'Đăng lên trang Releases (bỏ chọn nếu chỉ muốn thử đóng gói)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra cú pháp PowerShell
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\app\DonDep.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; exit 1 }
          Write-Host 'Syntax OK'

      - name: Đọc số phiên bản
        id: ver
        shell: powershell
        run: |
          $line = Select-String -Path app\DonDep.ps1 -Pattern "AppVersion\s*=\s*'([^']+)'" | Select-Object -First 1
          $ver = $line.Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}'.TrimStart('v') -ne $ver) {
            Write-Host "Version in DonDep.ps1 ($ver) differs from tag (${{ github.ref_name }})"; exit 1
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=v$ver`n", (New-Object Text.UTF8Encoding($false)))
          Write-Host "Version: $ver"

      - name: Tạo file .exe
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $sma = [PSObject].Assembly.Location
          Write-Host "SMA: $sma"
          New-Item -ItemType Directory -Force -Path out\DonDepMayTinh | Out-Null
          & $csc /nologo /target:winexe /optimize /win32icon:app\DonDep.ico /out:"out\DonDepMayTinh\Don Dep May Tinh.exe" /r:System.dll /r:System.Windows.Forms.dll /r:"$sma" app\Launcher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Chạy thử file .exe
        shell: powershell
        run: |
          Copy-Item app\DonDep.ps1, app\DonDep.ico, 'app\HUONG DAN.txt' out\DonDepMayTinh\
          $p = Start-Process -FilePath 'out\DonDepMayTinh\Don Dep May Tinh.exe' -ArgumentList '--selftest' -Wait -PassThru
          $r = Get-Content out\DonDepMayTinh\selftest.txt -Raw -ErrorAction SilentlyContinue
          Write-Host "exit=$($p.ExitCode) result=$r"
          Remove-Item out\DonDepMayTinh\selftest.txt -ErrorAction SilentlyContinue
          $log = Get-Content "$([Environment]::GetFolderPath('MyDocuments'))\DonDepMayTinh\loi_khoi_dong.txt" -Raw -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or $r -notmatch 'UI_OK') {
            $msg = ("exit=$($p.ExitCode) | ket qua=$r | log=$log") -replace "`r?`n", ' / '
            Write-Host "::error title=Selftest::$msg"
            exit 1
          }

      - name: Đóng gói .zip
        shell: powershell
        run: |
          Compress-Archive -Path out\DonDepMayTinh -DestinationPath out\DonDepMayTinh.zip -Force
          Get-ChildItem out\DonDepMayTinh

      - name: Lưu bản đóng gói (để tải thử)
        uses: actions/upload-artifact@v4
        with:
          name: DonDepMayTinh
          path: out/DonDepMayTinh.zip

      - name: Tạo trang phát hành
        if: github.ref_type == 'tag' || inputs.phat_hanh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Bản $TAG đã có — chỉ cập nhật file .zip."
            gh release upload "$TAG" out/DonDepMayTinh.zip --clobber
          else
            gh release create "$TAG" out/DonDepMayTinh.zip --target "$GITHUB_SHA" \
              --title "Dọn Dẹp Máy Tính $TAG" --notes-file .github/release-notes.md
          fi
